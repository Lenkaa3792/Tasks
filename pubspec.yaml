name: truefam_contribution_tracker
description: "A new Flutter project for tracking contributions."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0' # Using a recent stable SDK constraint

dependencies:
  flutter:
    sdk: flutter

  # For Google Sign-In & APIs
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  # gsheets: ^0.5.0 # Will evaluate if needed, starting with googleapis for sheets first

  # For SMS
  telephony: ^0.2.0 # Requires AndroidX. Note: This plugin might have limitations or require foreground service for background listening on newer Android.
  permission_handler: ^11.3.1

  # For Secure Storage
  flutter_secure_storage: ^9.2.2

  # Utilities
  intl: ^0.19.0
  http: ^1.2.1 # For authenticated HTTP clients for Google APIs
  shared_preferences: ^2.2.3 # For simple storage like sheet URL

  # UI/UX
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
